
name: BotStudio AI 2.0 - Separar archivos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener los dos ultimos commits
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extraer archivos del workflow anterior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source = subprocess.check_output(
              ['git', 'show', 'HEAD^:.github/workflows/android.yml'],
              text=True
          )
          files = {
              'settings.gradle': 'EOF_SETTINGS',
              'build.gradle': 'EOF_GRADLE',
              'gradle.properties': 'EOF_PROPS',
              'app/build.gradle': 'EOF_APP',
              'app/src/main/AndroidManifest.xml': 'EOF_MANIFEST',
              'app/src/main/java/com/botstudio/ai/MainActivity.java': 'EOF_JAVA',
          }
          for path, marker in files.items():
              start = "          cat > " + path + " <<'" + marker + "'\n"
              if start not in source:
                  raise RuntimeError('No se encontro el archivo original: ' + path)
              body = source.split(start, 1)[1]
              end = '\n          ' + marker
              if end not in body:
                  raise RuntimeError('Falta el cierre: ' + marker)
              body = body.split(end, 1)[0]
              lines = body.splitlines()
              if any(line.strip() and not line.startswith('          ') for line in lines):
                  raise RuntimeError('Sangria inesperada en: ' + path)
              code = '\n'.join(line[10:] if line.startswith('          ') else '' for line in lines) + '\n'
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(code, encoding='utf-8')
              print('Creado:', path, len(code), 'caracteres')

          Path('.gitignore').write_text(
              '.gradle/\n**/build/\nlocal.properties\n.idea/\n*.iml\n*.jks\n*.keystore\n',
              encoding='utf-8'
          )
          readme = Path('README.md')
          old = readme.read_text(encoding='utf-8') if readme.exists() else '# BotStudio AI\n'
          note = ('\n\n## Estructura del proyecto\n'
                  '- `app/src/main/java/`: codigo de la aplicacion Android.\n'
                  '- `app/src/main/AndroidManifest.xml`: permisos y Activity.\n'
                  '- `app/build.gradle`: configuracion de Android 16.\n'
                  '- `.github/workflows/android.yml`: compilacion automatica.\n\n'
                  'Los APK de prueba se descargan desde GitHub Actions > Artifacts.\n'
                  'No publiques claves API en GitHub.\n')
          if '## Estructura del proyecto' not in old:
              readme.write_text(old.rstrip() + '\n' + note, encoding='utf-8')
          PY

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generar Gradle Wrapper
        run: |
          gradle --no-daemon wrapper --gradle-version 8.13
          chmod +x gradlew

      - name: Compilar APK desde archivos separados
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Guardar archivos en el repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .gitignore settings.gradle build.gradle gradle.properties app gradle gradlew gradlew.bat
          if ! git diff --cached --quiet; then
            git commit -m 'BotStudio AI 2.0: separar codigo Android y Gradle del workflow'
            git push origin HEAD:main
          fi

      - name: Entregar APK
        uses: actions/upload-artifact@v4
        with:
          name: BotStudio-AI-Android16
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
